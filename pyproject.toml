[project]
name = "agrof-vision"
version = "2.0.0"
description = "Leaf health screening from a single photo, built on OpenCV 5."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "opencv-python-headless==5.0.0.93",
  "numpy>=2.2",
  "fastapi>=0.140",
  "uvicorn[standard]>=0.50",
  "python-multipart>=0.0.20",
]

[dependency-groups]
dev = ["pytest>=9", "httpx2", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agrof_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File"]
